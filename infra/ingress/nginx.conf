# Single ingress point, mirroring Squid as the single egress point. web and api stay on the
# internal network with no default route; only this container straddles the boundary, and
# Docker will not publish a host port for a container that is internal-only.
events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Docker's embedded DNS, re-resolved: with a literal name in proxy_pass nginx caches the
  # address at startup and keeps sending traffic to the old IP after a container is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 5173;
    set $web_upstream web;
    location / {
      proxy_pass http://$web_upstream:5173;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }
  }

  server {
    listen 3000;
    set $api_upstream api;
    location / {
      proxy_pass http://$api_upstream:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
