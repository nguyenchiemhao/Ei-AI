name: ei-ai

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17@sha256:40b404964359299eefdd5f8518facf1886c562848cf4de13b6eaf91cb70c2b87
    # The password arrives through env_file rather than ${...} interpolation: the Dev
    # Container starts compose without --env-file, and an interpolated secret makes it
    # fail to parse before any service is created.
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: eiai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d eiai']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  infinity:
    image: michaelf34/infinity:0.0.76@sha256:90bd83ecfb9922e9fdceec906cfb79863ad8aeaa45b15b950266679c3e2efd24
    command:
      - v2
      - --model-id
      - BAAI/bge-m3
      - --model-id
      - BAAI/bge-reranker-v2-m3
      - --port
      - '7997'
    environment:
      HF_HOME: /models
    volumes:
      - models:/models
    # The gate runs a plain `docker compose up`, so the reservation belongs here:
    # in an overlay it would silently hand the default stack a CPU-bound embedder.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7997/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    networks: [backend]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: dev
    env_file:
      - ../../.env
    volumes:
      - ../../apps/api:/workspace/apps/api
      - ../../packages:/workspace/packages
      - api-node-modules:/workspace/node_modules
      - api-app-node-modules:/workspace/apps/api/node_modules
      # dist stays inside the container: emitted across the bind mount it lands too late
      # for the watcher's immediate restart, and the app dies on a missing main.js.
      - api-dist:/workspace/apps/api/dist
      - uploads:/workspace/uploads
    expose:
      - '3000'
      - '9229'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  ingest-worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: dev
    command: ['sh', '-c', 'pnpm --filter @ei-ai/api build && pnpm --filter @ei-ai/api start:worker']
    env_file:
      - ../../.env
    volumes:
      - ../../apps/api:/workspace/apps/api
      - ../../packages:/workspace/packages
      - worker-node-modules:/workspace/node_modules
      - worker-app-node-modules:/workspace/apps/api/node_modules
      - worker-dist:/workspace/apps/api/dist
      - uploads:/workspace/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  parser:
    build:
      context: ../..
      dockerfile: apps/parser/Dockerfile
    volumes:
      - uploads:/workspace/uploads:ro
    networks: [backend]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: dev
    volumes:
      - ../../apps/web:/workspace/apps/web
      - web-node-modules:/workspace/node_modules
      - web-app-node-modules:/workspace/apps/web/node_modules
    expose:
      - '5173'
    networks: [backend]

  squid:
    image: ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    volumes:
      - ../squid/squid.conf:/etc/squid/squid.conf:ro
      - ../squid/allowlist.conf:/etc/squid/allowlist.conf:ro
      # FR-46 reconciles egress against this log, so it outlives the container.
      - squid-logs:/var/log/squid
    healthcheck:
      test: ['CMD-SHELL', 'squid -k check || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    # The only service on both networks: everything else reaches the outside through it.
    networks: [backend, egress]

  ingress:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    volumes:
      - ../ingress/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '4180:3000'
      - '4173:5173'
      - '127.0.0.1:5433:5432'
    depends_on: [api, web]
    # Both networks, like squid: the only way in, as squid is the only way out.
    networks: [backend, ingress]

  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:cbcdcb52d484e08e23bfc0135afa5beadd2d540513bbb7c65b233231fa033ff4
    # dev-local only: the default profile generates nothing in Phase 1, and the 4 GB card is
    # already carrying both embedding models. Start it with --profile dev-local.
    profiles: [dev-local]
    # -c 4096: the model advertises a 262k context and llama.cpp sizes the KV cache to it,
    # which the 18 GB WSL cap cannot hold — the container is OOM-killed while loading.
    command:
      [
        '-m',
        '/models/qwen3-4b-instruct-q4_k_m.gguf',
        '-c',
        '4096',
        '--host',
        '0.0.0.0',
        '--port',
        '8080',
      ]
    volumes:
      - models:/models
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks: [backend]

volumes:
  postgres-data:
  redis-data:
  models:
  squid-logs:
  uploads:
  api-node-modules:
  api-app-node-modules:
  api-dist:
  worker-dist:
  worker-node-modules:
  worker-app-node-modules:
  web-node-modules:
  web-app-node-modules:

networks:
  backend:
    internal: true
  egress:
  ingress:
