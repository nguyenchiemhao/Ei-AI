# Intentionally empty. Empty means deny: with no destination listed here, every
# outbound request from the backend network is refused and logged as TCP_DENIED.
# Entries are generated from allowlist_entries by T-5.2-01; until then a line is
# added by hand and Squid reloaded, and the reason is recorded in the audit trail.

# The bootstrap destination. infinity fetches BAAI/bge-m3 and bge-reranker-v2-m3 from here on first
# start, and until it has them the stack comes up with an embedder that cannot answer. Added by
# hand, as the header above says, and recorded here rather than left as the undocumented step that
# populated the development machine.
#
# Default-deny is unchanged: every destination not named below is still refused, which is what
# verify-egress.sh proves against example.com.
acl model_hub dstdomain .huggingface.co .hf.co .xethub.hf.co
http_access allow model_hub
