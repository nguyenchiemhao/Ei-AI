# The only route out of the backend network. Everything not named in allowlist.conf is denied
# by the last rule in this file, and allowlist.conf ships empty.

http_port 3128

# C-3 · the format carries a distinct name. Redefining a built-in name — `squid`, `common`,
# `combined`, `referrer`, `useragent` — makes Squid 6 refuse to start.
# %ru holds the CONNECT target for tunnelled requests, which is the destination FR-46
# reconciles against; %ssl::>sni is empty without ssl_bump and is deliberately absent.
logformat eiai %ts.%03tu %6tr %>a %Ss/%03>Hs %rm %ru bytes_in=%<st bytes_out=%>st peer=%Sh/%<a
access_log stdio:/var/log/squid/access.log eiai
cache_log /var/log/squid/cache.log

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

http_access allow localhost manager
http_access deny manager

# Every permitted destination arrives from here. The file ships empty, which is the working
# configuration and not a gap: with no `http_access allow` inside it, nothing matches and the
# final rule refuses everything. T-5.2-01 generates this file from allowlist_entries.
include /etc/squid/eiai/allowlist.conf

# Default deny. Nothing below this line, ever.
http_access deny all

cache deny all
