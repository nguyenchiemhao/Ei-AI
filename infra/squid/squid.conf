# Minimum to boot and deny. T-2.2-01 adds the custom log format (C-3) and the full ACLs.
http_port 3128

acl backend src 172.16.0.0/12
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Destinations permitted by name. The file ships empty, so this matches nothing.
include /etc/squid/allowlist.conf

http_access allow localhost manager
http_access deny manager

# Default deny: anything not allowed by an included rule above is refused here.
http_access deny all

cache deny all
# The image's entrypoint tails /var/log/squid/*.log to stdout; squid itself drops to
# user 'proxy' and cannot open /dev/stdout directly.
access_log stdio:/var/log/squid/access.log
